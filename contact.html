      <h1>お問い合わせ</h1>
      <p class="contact__lead">事業・採用・TELEMO導入のご相談など、お気軽にお問い合わせください。</p>
      <form class="contact__form" id="contactForm" action="https://script.google.com/macros/s/AKfycbzCK7SQe3MKfglaFz-YFDP2pD3V4jWLX-Rw1t4_WD1yVh7bzv1SjM722_u0sbVAj_c/exec" method="POST" accept-charset="UTF-8" novalidate>
            <input type="hidden" name="return_url" />
            <input type="checkbox" name="botcheck" style="display: none" tabindex="-1" autocomplete="off" />
            <div class="field">
              <label for="contact-name">お名前</label>
              <input type="text" id="contact-name" name="name" placeholder="山田 太郎" required />
            </div>
            <div class="field">
              <label for="contact-company">会社名</label>
              <input type="text" id="contact-company" name="company" placeholder="株式会社○○" />
            </div>
            <div class="field">
              <label for="contact-email">メールアドレス</label>
              <input type="email" id="contact-email" name="email" placeholder="you@example.com" required />
            </div>
            <div class="field">
              <label for="contact-tel">電話番号</label>
              <input type="tel" id="contact-tel" name="tel" placeholder="03-1234-5678" />
            </div>
            <div class="field field--full">
              <label for="contact-message">お問い合わせ内容</label>
              <textarea id="contact-message" name="message" rows="4" placeholder="ご相談内容をご記入ください" required></textarea>
            </div>
            <button type="submit" class="btn btn--primary btn--lg">
              <span>送信する</span><i class="btn__arrow">→</i>
            </button>
            <p class="contact__status" id="formStatus" role="status"></p>
          </form>
      <a class="policy-page__back" href="./index.html#footer">トップページへ戻る</a>
